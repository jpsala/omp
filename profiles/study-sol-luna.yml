# Controlled study profile: Sol medium orchestrator + Luna max implementer.
# Launch with: omp --config profiles/study-sol-luna.yml
# Prewalk is off so the parent remains the orchestrator and delegates to Task.
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-luna:max
  task: openai-codex/gpt-5.6-luna:max
  tiny: openai-codex/gpt-5.6-luna:max
cycleOrder:
  - default
  - smol
prewalk:
  enabled: false
task:
  agentModelOverrides:
    task: openai-codex/gpt-5.6-luna:max
  maxConcurrency: 1
