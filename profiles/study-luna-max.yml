# Controlled study profile: Luna Max is both orchestrator and implementer.
# Launch with: omp --config profiles/study-luna-max.yml
# Prewalk is off so the baseline keeps one model across parent and Task.
modelRoles:
  default: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-luna:max
  plan: openai-codex/gpt-5.6-luna:max
  smol: openai-codex/gpt-5.6-luna:max
  task: openai-codex/gpt-5.6-luna:max
  tiny: openai-codex/gpt-5.6-luna:max
cycleOrder:
  - default
prewalk:
  enabled: false
task:
  agentModelOverrides:
    task: openai-codex/gpt-5.6-luna:max
  maxConcurrency: 1
