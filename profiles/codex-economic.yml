# Reversible Codex economic mode. Launch from any repository with:
# omp --config C:/dev/omp/profiles/codex-economic.yml
# Sol remains available through plan/slow roles; routine execution uses Luna High.
modelRoles:
  default: openai-codex/gpt-5.6-luna:high
  plan: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-5.6-sol:high
  task: openai-codex/gpt-5.6-luna:high
  smol: openai-codex/gpt-5.6-luna:high
  cheap: openai-codex/gpt-5.6-luna:high
  tiny: openai-codex/gpt-5.6-luna:medium
cycleOrder:
  - default
  - plan
  - slow
prewalk:
  enabled: false
